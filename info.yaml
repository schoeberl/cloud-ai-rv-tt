# Tiny Tapeout SKY26d submission metadata
project:
  title: "Wildcat-style RV32I CPU"
  author: "Martin Schoeberl"
  discord: ""
  description: "Three-stage RV32I processor with host-served instruction and data memory"
  language: "SystemVerilog"
  clock_hz: 10000000
  tiles: "6x2"
  top_module: "tt_um_schoeberl_rv32i"
  source_files:
    - "tt_um_schoeberl_rv32i.v"
    - "WildcatThreeStage.sv"
pinout:
  ui[0]: "Memory response data bit 0 / ACK error"
  ui[1]: "Memory response data bit 1"
  ui[2]: "Memory response data bit 2"
  ui[3]: "Memory response data bit 3"
  ui[4]: "Memory response data bit 4"
  ui[5]: "Memory response data bit 5"
  ui[6]: "Memory response data bit 6"
  ui[7]: "Memory response data bit 7"
  uo[0]: "Readback bit 0"
  uo[1]: "Readback bit 1"
  uo[2]: "Readback bit 2"
  uo[3]: "Readback bit 3"
  uo[4]: "Readback bit 4"
  uo[5]: "Readback bit 5"
  uo[6]: "Readback bit 6"
  uo[7]: "Readback bit 7"
  uio[0]: "Host command bit 0 (input)"
  uio[1]: "Host command bit 1 (input)"
  uio[2]: "Host command bit 2 (input)"
  uio[3]: "Host command bit 3 (input)"
  uio[4]: "Byte index bit 0 (input)"
  uio[5]: "Byte index bit 1 (input)"
  uio[6]: "Unused (input)"
  uio[7]: "Unused (input)"
